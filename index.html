<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>PaintRooms</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    input, button { padding: 6px; margin: 4px; }
    li { cursor: pointer; }
    .board { position: relative; width: 800px; height: 500px; }
    canvas { border: 1px solid #333; touch-action: none; }
    .cursor {
      position: absolute; pointer-events: none;
      color: white; font-size: 12px; padding: 2px 6px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- VISTA LOBBY -->
    <div v-if="!joined">
      <h1>PaintRooms</h1>
      <input v-model="username" placeholder="El teu nom">
      <input v-model="roomName" placeholder="Nom de la sala">
      <button @click="join">Entrar / Crear sala</button>

      <h3>Sales actives</h3>
      <ul>
        <li v-for="r in roomList" :key="r" @click="roomName = r">{{ r }}</li>
      </ul>
    </div>

    <!-- VISTA ROOM -->
    <div v-else>
      <h2>Sala: {{ roomName }} — Jo: {{ username }}</h2>

      <div>
        Color <input type="color" v-model="color">
        Gruix <input type="range" min="1" max="20" v-model.number="width"> {{ width }}
        <button @click="clearCanvas">Netejar</button>
        <button @click="leave">Sortir</button>
      </div>

      <div class="board">
        <canvas ref="canvas" width="800" height="500"
                @pointerdown="onDown" @pointermove="onMove"
                @pointerup="onUp" @pointerleave="onUp"></canvas>

        <!-- Cursores de los demás usuarios -->
        <div v-for="(c, id) in cursors" :key="id" class="cursor"
             :style="{ left: c.x + 'px', top: c.y + 'px', background: c.color }">
          ● {{ c.username }}
        </div>
      </div>

      <h3>Usuaris a la sala</h3>
      <ul>
        <li v-for="u in users" :style="{ color: u.color }">{{ u.username }}</li>
      </ul>
    </div>

  </div>

  <!-- Socket.IO cliente (lo sirve automáticamente el servidor) -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Vue 3 desde CDN -->
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>

  <script>
    const socket = io();

    Vue.createApp({
      data() {
        return {
          username: '',
          roomName: '',
          joined: false,
          roomList: [],
          users: [],
          cursors: {},      // { socketId: { x, y, username, color } }
          color: '#000000',
          width: 4,
          drawing: false,
          last: null        // último punto que he dibujado yo
        };
      },

      mounted() {
        this.remote = {};   // último punto de cada usuario remoto { socketId: {x, y, color, width} }

        // ---- Eventos que llegan del servidor ----
        socket.on('room_list', (list) => this.roomList = list);
        socket.on('room_users', (list) => this.users = list);

        socket.on('init_state', async (strokes) => {
          this.joined = true;
          await Vue.nextTick();          // esperar a que exista el <canvas>
          this.clearLocal();
          strokes.forEach((s) => this.drawStroke(s));
        });

        socket.on('cursor_move', (c) => this.cursors[c.id] = c);

        socket.on('user_left', (id) => {
          delete this.cursors[id];
          delete this.remote[id];
        });

        socket.on('draw_begin', (d) => {
          this.remote[d.id] = d;
          this.drawLine(d, d, d.color, d.width);
        });

        socket.on('draw_move', (d) => {
          const prev = this.remote[d.id];
          if (!prev) return;
          this.drawLine(prev, d, prev.color, prev.width);
          prev.x = d.x;
          prev.y = d.y;
        });

        socket.on('draw_end', (d) => delete this.remote[d.id]);

        socket.on('clear_canvas', () => this.clearLocal());

        // Si se refresca la página, volvemos a entrar a la misma sala
        const saved = sessionStorage.getItem('paintrooms');
        if (saved) {
          const s = JSON.parse(saved);
          this.username = s.username;
          this.roomName = s.roomName;
          this.join();
        }
      },

      methods: {
        join() {
          if (!this.username.trim() || !this.roomName.trim()) return;
          sessionStorage.setItem('paintrooms', JSON.stringify({
            username: this.username, roomName: this.roomName
          }));
          socket.emit('join_room', { roomName: this.roomName, username: this.username });
        },

        leave() {
          socket.emit('leave_room');
          sessionStorage.removeItem('paintrooms');
          this.joined = false;
          this.cursors = {};
          this.users = [];
        },

        // ---- Ratón / touch (pointer events sirven para los dos) ----
        onDown(e) {
          this.drawing = true;
          this.last = { x: e.offsetX, y: e.offsetY };
          this.drawLine(this.last, this.last, this.color, this.width);
          socket.emit('draw_begin', { ...this.last, color: this.color, width: this.width });
        },

        onMove(e) {
          const p = { x: e.offsetX, y: e.offsetY };
          socket.emit('cursor_move', p);
          if (!this.drawing) return;
          this.drawLine(this.last, p, this.color, this.width);
          socket.emit('draw_move', p);
          this.last = p;
        },

        onUp() {
          if (!this.drawing) return;
          this.drawing = false;
          socket.emit('draw_end', {});
        },

        clearCanvas() {
          socket.emit('clear_canvas', {});
        },

        // ---- Dibujo en el canvas ----
        drawLine(a, b, color, width) {
          const canvas = this.$refs.canvas;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        },

        drawStroke(s) {
          for (let i = 0; i < s.points.length; i++) {
            const prev = s.points[i - 1] || s.points[i];
            this.drawLine(prev, s.points[i], s.color, s.width);
          }
        },

        clearLocal() {
          const canvas = this.$refs.canvas;
          if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
